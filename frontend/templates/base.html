<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Intelligent Bug Diagnosis Platform{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="app-header">
        <div class="header-container">
            <a href="{{ url_for('web.index') }}" class="brand-logo">
                <span class="logo-text">BugDiagnosis<span class="accent">AI</span></span>
            </a>
            <nav class="nav-links">
                <a href="{{ url_for('web.index') }}" class="nav-link">Overview</a>
                <a href="{{ url_for('web.submit') }}" class="nav-link">Submit Bug</a>
                <a href="{{ url_for('web.history') }}" class="nav-link">Bug History</a>
                <a href="{{ url_for('web.knowledge_base') }}" class="nav-link">Historical KB</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="app-footer">
        <div class="footer-container">
            <p>Intelligent Bug Diagnosis Platform with Fix Recommendation Assistance &bull; Multi-Agent RAG Architecture</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
