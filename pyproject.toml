[project]
name = "intelligent-bug-diagnosis"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
description = "Intelligent Bug Diagnosis Platform with Fix Recommendation Assistance"
readme = "README.md"
dependencies = [
    "Flask>=3.0.0",
    "Werkzeug>=3.0.0",
    "SQLAlchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["venv", ".venv", "env", "archive", "__pycache__", ".git", "evaluation/reports", "vector_store"]

[tool.ruff.lint]
# Block on real errors only — pyflakes + pycodestyle errors. Defer stylistic rules to v1.0.1.
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
# E4: import errors, E7: statement errors, E9: runtime errors, F: pyflakes (unused vars, undefined names)
# Ignored: E501 line-too-long (handled by formatter), all stylistic UP/BLE/SIM/RUF/I/TID/PIE/G/PTH categories.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F841"]
"evaluation/*" = ["F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["venv", ".venv", "env", "archive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["agents", "backend", "knowledge_base"]
