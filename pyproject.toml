[project]
name = "intelligent-bug-diagnosis"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
description = "Intelligent Bug Diagnosis Platform with Fix Recommendation Assistance"
readme = "README.md"
dependencies = [
    "Flask>=3.0.0",
    "Werkzeug>=3.0.0",
    "SQLAlchemy>=2.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "pytest>=8.0.0",
    "requests>=2.31.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["agents", "backend", "knowledge_base"]
